    <style>
        :root {
            --bg-grad: linear-gradient(180deg, #050b14 0%, #0a1128 100%);
            --accent-gold: #FFD700;
            --accent-cyan: #00F2FE;
            --neon-glow: 0 0 25px rgba(255, 215, 0, 0.4);
            --card-glass: rgba(18, 28, 51, 0.65);
            --border-glass: rgba(255, 215, 0, 0.25);
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Spheres */
        .glow-orb-1 {
            position: fixed;
            top: -100px;
            left: -50px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,215,0,0.18) 0%, transparent 70%);
            pointer-events: none;
        }

        .glow-orb-2 {
            position: fixed;
            bottom: -100px;
            right: -50px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0,242,254,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .main-card {
            width: 100%;
            max-width: 390px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
            position: relative;
            z-index: 1;
        }

        /* Dynamic Status Header */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulseDot 1.2s infinite alternate;
        }

        @keyframes pulseDot {
            from { opacity: 0.4; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* Avatar Hexagonal Shield Frame */
        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-gold), transparent, var(--accent-cyan));
            animation: spinRing 5s linear infinite;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .profile-img-box {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0a1128;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .profile-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Brand Title */
        .brand-title {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF099 0%, #FFD700 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
            letter-spacing: 0.5px;
        }

        .brand-desc {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Stats Grid - Updated Members 10K+ */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 6px;
        }

        .stat-num {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Main Conversion CTA */
        .btn-wrapper {
            width: 100%;
        }

        .join-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            font-size: 18px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: var(--neon-glow);
            animation: btnPulse 1.8s infinite;
            overflow: hidden;
        }

        .join-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(255, 255, 255, 0.5),
                transparent
            );
            transform: rotate(30deg);
            animation: sweep 2s infinite;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        @keyframes btnPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 35px rgba(255, 215, 0, 0.7); }
            100% { transform: scale(1); }
        }

        /* Timer Section */
        .timer-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border-glass);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .timer-clock {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-cyan);
            font-family: monospace;
        }

        /* Live Activity Floating Popup */
        .fomo-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 17, 40, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
            white-space: nowrap;
        }

        /* Footer */
        .credit-footer {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .credit-footer a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 700;
        }
    </style>

    <script>
        // Countdown Timer
        let time = 15;
        const timerElem = document.getElementById('timer');
        const timerInterval = setInterval(() => {
            if (time <= 0) {
                clearInterval(timerInterval);
                timerElem.innerText = "00:00";
            } else {
                time--;
                timerElem.innerText = "00:" + (time < 10 ? '0' + time : time);
            }
        }, 1000);

        // Dynamic Join Notifications
        const userList = ["Amit P.", "Rohit S.", "Rahul M.", "Karan V.", "Suresh T.", "Deepak G."];
        const fomoElem = document.getElementById('fomo');
        
        setInterval(() => {
            const randomUser = userList[Math.floor(Math.random() * userList.length)];
            fomoElem.innerHTML = `<span style="color: var(--accent-gold);">🔥 ${randomUser}</span> just joined the VIP Channel!`;
        }, 3500);
